name: Publish Book EPUB

on:
  workflow_dispatch:
    inputs:
      book:
        description: Book slug from Notion
        required: true
        default: japanese-gardens
        type: choice
        options:
          - japanese-gardens
          - hidden-japan
          - japan-by-train
          - kyoto
          - tokyo
      mode:
        description: Publication action
        required: true
        default: validate
        type: choice
        options:
          - validate
          - build
          - publish

permissions:
  contents: write

concurrency:
  group: publish-book-${{ inputs.book }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ inputs.mode }} ${{ inputs.book }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOTION_API_KEY: ${{ secrets.SAKURA_NOTION_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      BOOKAPP_RELEASE_REPOSITORY: Equilibriumpress/bookapp-books

    steps:
      - name: Check out catalog repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Publisher/package.json

      - name: Check Notion access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NOTION_API_KEY:-}" || {
            echo "SAKURA_NOTION_API_KEY is not available to this repository."
            exit 1
          }

      - name: Install publisher
        working-directory: Publisher
        run: npm install --no-audit --no-fund

      - name: Typecheck publisher
        working-directory: Publisher
        run: npm run typecheck

      - name: Validate book
        working-directory: Publisher
        run: npm run validate -- "${{ inputs.book }}"

      - name: Build EPUB
        if: inputs.mode == 'build' || inputs.mode == 'publish'
        working-directory: Publisher
        run: npm run build -- "${{ inputs.book }}"

      - name: Install EPUBCheck
        if: inputs.mode == 'build' || inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          echo "EPUBCHECK_JAR=/tmp/epubcheck/epubcheck-5.3.0/epubcheck.jar" >> "$GITHUB_ENV"

      - name: Validate EPUB with EPUBCheck
        if: inputs.mode == 'build' || inputs.mode == 'publish'
        shell: bash
        working-directory: Publisher
        run: |
          set -euo pipefail
          EPUB_FILE=$(find output -maxdepth 1 -name "${{ inputs.book }}-v*.epub" -print -quit)
          test -n "$EPUB_FILE"
          java -jar "$EPUBCHECK_JAR" "$EPUB_FILE"

      - name: Upload build artifact
        if: inputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.book }}-epub
          path: Publisher/output/*.epub
          if-no-files-found: error

      - name: Publish GitHub Release and catalog
        if: inputs.mode == 'publish'
        working-directory: Publisher
        run: npm run publish -- "${{ inputs.book }}"

      - name: Publication summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Bookapp publisher"
            echo ""
            echo "- Book: \`${{ inputs.book }}\`"
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo "- Repository: \`Equilibriumpress/bookapp-books\`"
          } >> "$GITHUB_STEP_SUMMARY"
